server:
  # Render 는 PORT 환경변수로 포트를 지정합니다. 로컬에서는 8080.
  port: ${PORT:8080}

spring:
  application:
    name: todo-backend

  datasource:
    # Supabase > Connect 버튼 > "Session pooler" 연결 정보를 사용합니다.
    # 예) jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    # Session pooler 의 사용자명은 "postgres.<project-ref>" 형식입니다.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase 무료 플랜의 커넥션 한도를 고려해 작게 유지
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    # 테이블은 supabase/schema.sql 로 생성하므로 Hibernate 는 스키마를 검증만 합니다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# 허용할 프론트엔드 Origin (쉼표로 구분, 와일드카드 패턴 허용)
# 예) https://my-todo.vercel.app,https://my-todo-*.vercel.app
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
